<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- assign title = page.title | default: site.title -%}
  {%- assign description = page.description | default: site.description -%}
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/pictures/preview.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Relational Intelligence: Structured Language Models for efficient and responsible AI">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#040303">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="icon" href="{{ '/pictures/icon-192.png' | relative_url }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ '/pictures/apple-touch-icon.png' | relative_url }}">
  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #040303; --card: #111110; --card-2: #1c1c1a; --line: #2c2c2a;
      --text: #edebe5; --muted: #a09f9b; --diagram: #adada6;
      --green: #52bd52; --red: #ed6159;
    }
    :root[data-theme="light"] {
      --bg: #eae9e9; --card: #f6f5f3; --card-2: #ffffff; --line: #d3d1cc;
      --text: #1d1d1b; --muted: #5d5c58; --diagram: #6b6a66;
      --green: #1e821e; --red: #be2828;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    a { color: var(--red); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--green); }
    h1, h2, h3 { line-height: 1.15; margin: 0 0 0.6em; letter-spacing: -0.01em; }
    h1 { font-size: 2em; }
    h1, h2 { color: var(--green); }
    h3 { color: var(--red); }
    p { margin: 0 0 1em; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 640px) { .wrap { padding: 0 32px; } }

    .site-nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-top: 1.25rem; padding-bottom: 1.25rem; }
    .site-nav .brand { color: var(--red); font-weight: 700; text-decoration: none; white-space: nowrap; }
    .site-nav nav { display: flex; gap: 1.25rem; }
    .site-nav nav a { color: var(--text); text-decoration: none; font-weight: 500; }
    .site-nav nav a:hover, .site-nav nav a[aria-current] { color: var(--green); }

    main { padding-bottom: 2rem; }
    hr { border: 0; border-top: 1px solid var(--line); margin: clamp(2.5rem, 7vw, 4.5rem) 0; }
    h2 { margin-top: 0; }
    .muted { color: var(--muted); }
    .warn { color: var(--red); }

    /* Hero */
    .hero { display: grid; gap: 1rem 2rem; align-items: center; padding: 1rem 0; }
    .hero img { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
    .hero h1 { color: var(--red); margin-bottom: 0.4em; }
    .tagline { color: var(--green); font-weight: 600; }
    .pills { display: flex; flex-wrap: wrap; gap: 0.6rem; padding: 0; margin: 0; list-style: none; }
    .pills li { border: 2px solid var(--green); color: var(--green); border-radius: 999px; padding: 0.2rem 0.9rem; font-weight: 600; }
    @media (min-width: 820px) {
      .hero { grid-template-columns: 1fr 1.25fr; }
      .hero > div:last-child { text-align: right; }
      .pills { justify-content: flex-end; }
    }
    .logo-light { display: none !important; }
    :root[data-theme="light"] .logo-light { display: block !important; }
    :root[data-theme="light"] .logo-dark { display: none !important; }

    /* Markdown lists laid out in columns: {: .cols-2}, {: .cols-3}, {: .cols-4} */
    ul.cols-2, ul.cols-3, ul.cols-4 { list-style: none; padding: 0; margin: 1.5rem 0; display: grid; gap: 1.5rem; }
    @media (min-width: 720px) {
      ul.cols-2 { grid-template-columns: repeat(2, 1fr); }
      ul.cols-3 { grid-template-columns: repeat(3, 1fr); }
      ul.cols-4 { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 719px) { ul.halves { grid-template-columns: repeat(2, 1fr); column-gap: 1rem; } }
    ul[class*="cols-"] li p { margin: 0; }
    ul[class*="cols-"] li strong { display: block; color: var(--red); margin-bottom: 0.3em; }
    ul.cards li { background: var(--card); border: 1px solid color-mix(in srgb, var(--green) 55%, transparent); border-radius: 16px; padding: 1.5rem; }

    /* Diagrams */
    ul[class*="cols-"] li > svg { display: block; width: 100%; height: auto; max-height: 180px; margin-bottom: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
    ul.timeline li { color: var(--muted); }
    ul.timeline li > svg { background: none; border: 0; padding: 0; }
    ul.timeline li a { display: block; font-weight: 700; }
    .d-wire, .d-path, .d-lens, .d-faint { fill: none; stroke-linecap: round; }
    .d-wire { stroke: var(--diagram); stroke-width: 2; }
    .d-faint { stroke: var(--line); stroke-width: 0.8; }
    .d-path { stroke: var(--diagram); stroke-width: 2.5; }
    .d-lens { stroke: var(--green); stroke-width: 5; }
    circle.d-lens { fill: color-mix(in srgb, var(--green) 12%, transparent); }
    .d-box { fill: var(--card-2); stroke: var(--diagram); stroke-width: 1.5; }
    .d-text { fill: var(--text); font-family: inherit; }
    .d-label { fill: #fff; font-family: inherit; font-weight: 600; }
    .d-green { fill: var(--green); stroke: var(--diagram); stroke-width: 1.5; }
    .d-red { fill: var(--red); stroke: var(--diagram); stroke-width: 1.5; }
    .d-node { fill: var(--card-2); stroke: var(--diagram); stroke-width: 1; opacity: 0.6; }
    .d-dot { fill: var(--diagram); }
    .d-plus { fill: var(--card-2); stroke: var(--diagram); stroke-width: 1.5; }

    /* People: a list of "![photo](...) **name** *role* bio" */
    ul.people { row-gap: 2.5rem; }
    ul.people li { text-align: center; color: var(--muted); }
    ul.people img { width: 168px; height: 168px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 0.8rem; background: var(--card-2); }
    @media (max-width: 719px) { ul.people img { width: 120px; height: 120px; } }
    ul.people li strong { color: var(--text); margin: 0; }
    ul.people li strong a { color: inherit; text-decoration: none; }
    ul.people li strong a:hover { color: var(--green); }
    ul.people li em { display: block; font-style: normal; font-weight: 600; color: var(--red); margin-bottom: 0.4em; }
    .center { text-align: center; }

    footer { border-top: 1px solid var(--line); padding: 2rem 0 3rem; color: var(--muted); }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; justify-content: space-between; }
    footer a { color: var(--muted); }
    .theme-toggle { background: none; border: 0; padding: 0.25rem; color: var(--muted); font: inherit; cursor: pointer; opacity: 0.45; }
    .theme-toggle:hover { opacity: 1; color: var(--green); }
  </style>
</head>
<body>
  <header class="wrap site-nav">
    <a class="brand" href="{{ '/' | relative_url }}">Relational Intelligence</a>
    <nav aria-label="Main">
      <a href="{{ '/people' | relative_url }}"{% if page.url == '/people' %} aria-current="page"{% endif %}>People</a>
      <a href="{{ '/careers' | relative_url }}"{% if page.url == '/careers' %} aria-current="page"{% endif %}>Careers</a>
    </nav>
  </header>
  <main class="wrap">
{{ content }}
  </main>
  <footer>
    <div class="wrap">
      <span>© {{ site.time | date: '%Y' }} Relational Intelligence</span>
      <span>
        <a href="mailto:contact@rel-int.ai">contact@rel-int.ai</a>
        <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Lights">☀︎</button>
      </span>
    </div>
  </footer>
  <script>
    document.querySelector('.theme-toggle').addEventListener('click', function () {
      var light = document.documentElement.dataset.theme !== 'light';
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
    });
  </script>
</body>
</html>
